[project]
name = "g-chan"
version = "0.1.0"
description = "G酱 (Gちゃん) — Twitch AI VTuber bot"
requires-python = ">=3.11"
dependencies = [
    "twitchio>=2.10,<3.0",
    "twitchapi>=4.0.0",
    "google-genai>=0.3.0",
    "edge-tts>=6.1.0",
    "httpx[socks]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g_chan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# output_rules.py contains intentional long lines (markdown/JSON examples inside string literals)
"src/g_chan/prompts/output_rules.py" = ["E501"]
