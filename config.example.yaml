# twich的bot设置
twitch:
  channel: "your_channel_name"
  bot_username: "g_chan_bot"
  trigger: "@G酱"

# 交互模式 — 双路径
# VIP/Mod/Broadcaster 走即时路径,普通观众走批处理。所有时间字段 0 = 不限/禁用。
interaction:
  vip_window_ms: 2000 # VIP/Mod 最短间隔(ms),0 = 无限流
  batch_window_s: 5 # 普通观众消息累积窗口(秒)。0 = 完全不响应普通观众
  batch_cooldown_ms: 5000 # 两次 batch flush 最小间隔(ms,从 flush 开始算)。0 = 背靠背
  buffer_size: 10 # buffer 最大容量(per-user dedup 后)。0 = 不限

llm:
  # gemini | claude | openai | qwen (Phase 1 仅 gemini)
  provider: "gemini"
  model: "gemini-2.5-flash"
  temperature: 0.9
  max_tokens: 300
  timeout_s: 10
  # LLM 返回不合法 JSON / 空 text 时的回退回复(可选,缺省时用 pydantic 默认值)
  fallback:
    text: "诶?本小姐刚才走神了,你再说一遍嘛"
    kaomoji: "(=ω=)"
    # 8 mood 之一: happy/angry/sad/surprised/shy/thinking/tsundere/dizzy
    mood: "dizzy"
    # 回退语言 — 决定 TTS 用哪个声线念 fallback text。zh/en/ja
    language: "ja"

persona:
  prompt_file: "prompts/character.md"

stream_context:
  # 启用/关闭直播上下文 — 让 AI 知道直播间标题和当前游戏,需要申请 Twitch developer app
  # 不启用就设 false (此时不调 Helix API,client_id/secret 可留空)
  enabled: false
  # 启用时的轮询间隔(ms)
  poll_interval_ms: 30000

tts:
  enabled: true
  # 每个语言对应的 Edge TTS voice 名称。zh 备选: XiaoxiaoNeural/XiaoshuangNeural/XiaohanNeural
  # 完整 voice 列表: https://learn.microsoft.com/azure/ai-services/speech-service/language-support
  voices:
    zh: "zh-CN-XiaoyiNeural"
    en: "en-US-AvaNeural"
    ja: "ja-JP-NanamiNeural"
  rate: "+10%"
  pitch: "+10Hz"
  output_dir: "out"
  timeout_s: 10

# Live2D 角色表情和动作配置
live2d:
  # 启用 Live2D 表情/动作输出(false = 纯 chat 模式,LLM 不输出 expression/motion)
  enabled: true

  # 模型路径,空 = 自动扫描 Live2D/ 下第一个子文件夹递归找 *.model3.json
  # (auto-detect 找到的例:Live2D/Epsilon_free/runtime/Epsilon_free.model3.json)
  model_path: ""

  # AI 调用失败 / 频率裁剪 fail 时使用的表情和动作名
  # 空字符串 = 不传任何 expression / motion(角色保持当前状态)
  # 名字必须跟 model3.json 里 FileReferences.Expressions[*].Name / Motions key 完全一致(大小写敏感)
  default_expression: ""
  default_motion: ""

  # 采纳 LLM 选择的概率 [0.0, 1.0]
  # 1.0 = 每次都用 LLM 选的;0.0 = 永远不变;0.3 = 30% 概率
  expression_change_frequency: 1.0
  motion_change_frequency: 0.3      # motion 默认偏保守(别动不动就播)

  # 表情应用多少毫秒后自动切回 default_expression(0 = 不自动切回)
  # 比如 LLM 给了 Angry,1 秒后 viewer 自动切回 default
  expression_revert_ms: 1000

# WebSocket + 静态文件 server (Phase 3a:推 expression/motion/audio 给 viewer)
server:
  # 启用 → 起 FastAPI 跟 Twitch chat 并行跑
  # 禁用 → 纯 chat 模式,LLM 仍输出 expression/motion 但不推任何地方
  enabled: true
  host: "localhost"
  port: 8765
  # viewer 构建产物的目录,目录不存在则只服 /ws 端点不挂静态文件
  static_dir: "viewer/dist"

logging:
  # debug | info | warning | error
  level: "info"
  file: "logs/g-chan.log"
