# twich的bot设置
twitch:
  channel: "your_channel_name"
  bot_username: "g_chan_bot"
  trigger: "@G酱"

# bot繁忙设置
rate_limit:
  global_window_ms: 5000
  busy_reply: "G酱我被你们搞的好晕啊XD"

llm:
  # gemini | claude | openai | qwen (Phase 1 仅 gemini)
  provider: "gemini"
  model: "gemini-2.5-flash"
  temperature: 0.9
  max_tokens: 300
  timeout_s: 10
  # LLM 返回不合法 JSON / 空 text 时的回退回复(可选,缺省时用 pydantic 默认值)
  fallback:
    text: "诶?本小姐刚才走神了,你再说一遍嘛"
    kaomoji: "(=ω=)"
    # 8 mood 之一: happy/angry/sad/surprised/shy/thinking/tsundere/dizzy
    mood: "dizzy"
    # 回退语言 — 决定 TTS 用哪个声线念 fallback text。zh/en/ja
    language: "ja"

persona:
  prompt_file: "prompts/default.md"
  include_stream_context: true

stream_context:
  poll_interval_ms: 30000

tts:
  enabled: true
  # 每个语言对应的 Edge TTS voice 名称。zh 备选: XiaoxiaoNeural/XiaoshuangNeural/XiaohanNeural
  # 完整 voice 列表: https://learn.microsoft.com/azure/ai-services/speech-service/language-support
  voices:
    zh: "zh-CN-XiaoyiNeural"
    en: "en-US-AvaNeural"
    ja: "ja-JP-NanamiNeural"
  rate: "+10%"
  pitch: "+10Hz"
  output_dir: "out"
  timeout_s: 10

logging:
  # debug | info | warning | error
  level: "info"
  file: "logs/g-chan.log"
